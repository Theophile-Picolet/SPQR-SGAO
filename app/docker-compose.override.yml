# Development, loaded automatically with docker-compose.yml by `docker compose up` (npm run docker:up).
# The variables come from server/.env (model: server/.env.example): the `--env-file` flag of the npm scripts
# makes them available to these files, and `env_file` passes them to the server.
# The same database serves development and tests; back to the initial data: npm run docker:reset
services:
  db:
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      # Test data, loaded after the schema when the volume is empty (first start)
      - ./database/test-data.sql:/docker-entrypoint-initdb.d/02-test-data.sql:ro

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: dev
    env_file: server/.env
    environment:
      # Between containers the database is reached by its service name, on its own port
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "127.0.0.1:${APP_PORT}:${APP_PORT}"
    volumes:
      - ./server/src:/app/server/src
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # No health route yet: the check is that the port accepts connections
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(process.env.APP_PORT, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      target: dev
    environment:
      # `next dev` reads it at startup; the browser reaches the API through the port published by the server
      API_URL: http://localhost:${APP_PORT}
      # No usage data sent to the Next.js maintainers from the development container
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./client/src:/app/client/src
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
